<div class="place-order-container">
  <mat-card>
    <mat-card-header class="space">
      <mat-card-title>Place Your Order</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="orderForm" (ngSubmit)="placeOrder()" class="order-form">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Address</mat-label>
          <textarea matInput rows="3" formControlName="address" required></textarea>
          <mat-error *ngIf="orderForm.get('address')?.hasError('required')">
            Address is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Order Description</mat-label>
          <textarea matInput rows="3" formControlName="orderDescription"></textarea>
        </mat-form-field>

      </form>
    </mat-card-content>

    <mat-card-actions class="action-buttons">
      <button mat-raised-button color="primary" (click)="placeOrder()" [disabled]="orderForm.invalid">
        Place Order
      </button>
      <button mat-stroked-button color="warn" (click)="closeForm()">
        Cancel
      </button>
    </mat-card-actions>
  </mat-card>
</div>
