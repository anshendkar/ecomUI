<div class="review-container">
  <mat-card>
    <mat-card-title>Submit Your Review</mat-card-title>
    <mat-card-content>
      <form [formGroup]="reviewForm" (ngSubmit)="submitForm()">

        <!-- Star Rating -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Rating</mat-label>
          <mat-select formControlName="rating">
            <mat-option *ngFor="let star of [1, 2, 3, 4]" [value]="star">
              {{ star }} Star{{ star > 1 ? 's' : '' }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="reviewForm.get('rating')?.hasError('required')">
            Rating is required.
          </mat-error>
        </mat-form-field>

        <!-- Description -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput rows="4" formControlName="description"></textarea>
          <mat-error *ngIf="reviewForm.get('description')?.hasError('required')">
            Description is required.
          </mat-error>
        </mat-form-field>

        <!-- File Selection -->
        <div class="file-section">
          <button mat-raised-button color="primary" (click)="fileInput.click()" type="button">
            <mat-icon>upload</mat-icon> Select Image
          </button>
          <input type="file" hidden (change)="onFileSelected($event)" #fileInput accept="image/*" />
        </div>

        <!-- Image Preview -->
        <div class="image-preview" *ngIf="imagePreview">
          <img [src]="imagePreview" alt="Selected image preview" />
        </div>

        <!-- Submit Button -->
        <div class="submit-btn">
          <button mat-raised-button color="accent" type="submit" [disabled]="reviewForm.invalid">
            Submit Review
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
