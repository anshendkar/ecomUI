<ng-container>
  <div class="table-container">
    <mat-table #basicTable [dataSource]="myOrders" class="mat-elevation-z8" matSort>

      <!-- Tracking ID Column -->
      <ng-container matColumnDef="trackingId">
        <mat-header-cell *matHeaderCellDef> <b>Tracking ID</b> </mat-header-cell>
        <mat-cell *matCellDef="let myOrder"> {{myOrder.trackingId}} </mat-cell>
      </ng-container>

      <!-- Amount Column -->
      <ng-container matColumnDef="amount">
        <mat-header-cell *matHeaderCellDef> <b>Amount</b> </mat-header-cell>
        <mat-cell *matCellDef="let myOrder"> ₹{{myOrder.amount}} </mat-cell>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <mat-header-cell *matHeaderCellDef> <b>Description</b> </mat-header-cell>
        <mat-cell *matCellDef="let myOrder"> {{myOrder.orderDescription}} </mat-cell>
      </ng-container>

      <!-- Address Column -->
      <ng-container matColumnDef="address">
        <mat-header-cell *matHeaderCellDef> <b>Address</b> </mat-header-cell>
        <mat-cell *matCellDef="let myOrder"> {{myOrder.address}} </mat-cell>
      </ng-container>

      <!-- Date Column -->
      <ng-container matColumnDef="date">
        <mat-header-cell *matHeaderCellDef> <b>Date</b> </mat-header-cell>
        <mat-cell *matCellDef="let myOrder"> {{myOrder.date | date:'medium'}} </mat-cell>
      </ng-container>

      <!-- Order Status Column -->
      <ng-container matColumnDef="orderStatus">
        <mat-header-cell *matHeaderCellDef> <b>Status</b> </mat-header-cell>
        <mat-cell *matCellDef="let myOrder"> {{myOrder.orderStatus}} </mat-cell>
      </ng-container>

   <ng-container matColumnDef="action">
  <mat-header-cell *matHeaderCellDef> <b>Action</b> </mat-header-cell>
  <mat-cell *matCellDef="let myOrder">
    <span *ngIf="myOrder.orderStatus === 'Delivered'">
      <button mat-raised-button color="primary"
              [routerLink]="['/customer/ordered-products', myOrder.id]">
        Review
      </button>
    </span>
  </mat-cell>
</ng-container>

      <!-- Header & Row Definitions -->
      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
  </div>
</ng-container>
