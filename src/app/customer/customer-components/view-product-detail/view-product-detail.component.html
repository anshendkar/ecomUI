<div class="product-detail-container" *ngIf="product">

  <!-- Product Info -->
<mat-card class="product-info">
  <div class="product-header">
    <img
      class="product-image"
      *ngIf="product.imgUrl"
      [src]="'http://localhost:8080' + product.imgUrl"
      [alt]="product.name"
    />
    <div class="product-meta">
      <h2>{{ product.name }}</h2>
      <p class="price">₹{{ product.price }}</p>
      <p class="description">{{ product.description }}</p>
      <p><strong>Category:</strong> {{ product.categoryName }}</p>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="product-actions">
    <button mat-raised-button color="primary" (click)="addToCart(product.id)">
      Add to Cart
    </button>

    <button mat-raised-button color="accent" (click)="addToWishlist(product.id)">
      Add to Wishlist
    </button>
  </div>
</mat-card>

  <!-- Reviews Section -->
  <mat-card class="reviews" *ngIf="reviews.length > 0">
    <h3>Customer Reviews</h3>
    <mat-divider></mat-divider>

    <div class="review-list">
      <mat-card class="review-item" *ngFor="let review of reviews">
        <div class="review-header">
          <img
            class="review-image"
            *ngIf="review.imgUrl"
            [src]="'http://localhost:8080' + review.imgUrl"
            [alt]="review.username"
          />
          <div class="review-user">
            <h4>{{ review.username }}</h4>
            <span class="rating">⭐ {{ review.rating }}/5</span>
          </div>
        </div>
        <p class="review-text">{{ review.description }}</p>
      </mat-card>
    </div>
  </mat-card>

  <!-- FAQ Section -->
  <mat-card class="faqs" *ngIf="FAQS.length > 0">
    <h3>FAQs</h3>
    <mat-divider></mat-divider>
    <mat-accordion>
      <mat-expansion-panel *ngFor="let faq of FAQS">
        <mat-expansion-panel-header>
          <mat-panel-title>{{ faq.question }}</mat-panel-title>
        </mat-expansion-panel-header>
        <p>{{ faq.answer }}</p>
      </mat-expansion-panel>
    </mat-accordion>
  </mat-card>

</div>
