<div class="container">
  <h2>Add Category</h2>

  <form [formGroup]="categoryForm" (ngSubmit)="addCategory()">

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Name</mat-label>
      <input matInput type="text" placeholder="Enter category name" formControlName="name" />
      <mat-error *ngIf="categoryForm.get('name')?.hasError('required')">
        Name is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Description</mat-label>
      <textarea matInput placeholder="Enter category description" formControlName="description"></textarea>
      <mat-error *ngIf="categoryForm.get('description')?.hasError('required')">
        Description is required
      </mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="categoryForm.invalid">
      Add Category
    </button>
  </form>
</div>
