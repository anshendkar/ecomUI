<div class="container">
  <mat-card class="faq-card">
    <mat-card-title>Post FAQ</mat-card-title>
    <mat-card-content>
      <form [formGroup]="FaqForm" (ngSubmit)="postFaq()">

        <!-- Question Field -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Question</mat-label>
          <input matInput placeholder="Enter question" formControlName="question" />
          <mat-error *ngIf="FaqForm.get('question')?.hasError('required')">
            Question is required
          </mat-error>
        </mat-form-field>

        <!-- Answer Field -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Answer</mat-label>
          <textarea matInput placeholder="Enter answer" formControlName="answer" rows="4"></textarea>
          <mat-error *ngIf="FaqForm.get('answer')?.hasError('required')">
            Answer is required
          </mat-error>
        </mat-form-field>

        <!-- Submit Button -->
        <div class="button-container">
          <button mat-flat-button color="primary" type="submit" [disabled]="FaqForm.invalid">
            Submit FAQ
          </button>
        </div>
        
      </form>
    </mat-card-content>
  </mat-card>
</div>
