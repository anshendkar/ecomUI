<div class="container">
  <h2>Add Product</h2>

  <form [formGroup]="productForm" (ngSubmit)="addProduct()">
    <!-- File Upload -->
    <div class="file-upload-container">
      <label class="file-upload-label">
        <span>Select a File</span>
        <input type="file" (change)="onFileSelected($event)" hidden />
        <mat-icon>attach_file</mat-icon>
      </label>

      <div *ngIf="imagePreview" class="img-preview">
        <div class="circle-img">
          <img [src]="imagePreview" alt="Selected Image" class="preview-image" />
        </div>
      </div>
    </div>

    <!-- Category -->
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Select Category</mat-label>
      <mat-select formControlName="categoryId" required>
        <mat-option *ngFor="let category of listOfCategories" [value]="category.id">
          {{ category.name }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="productForm.get('categoryId')?.hasError('required')">Category is required</mat-error>
    </mat-form-field>

    <!-- Name -->
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Product Name</mat-label>
      <input matInput formControlName="name" required />
      <mat-error *ngIf="productForm.get('name')?.hasError('required')">Name is required</mat-error>
    </mat-form-field>

    <!-- Price -->
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Price</mat-label>
      <input matInput type="number" formControlName="price" required />
      <mat-error *ngIf="productForm.get('price')?.hasError('required')">Price is required</mat-error>
    </mat-form-field>

    <!-- Description -->
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description"></textarea>
    </mat-form-field>

    <!-- Submit -->
    <button mat-raised-button color="primary" type="submit" [disabled]="productForm.invalid">
      Add Product
    </button>
  </form>
</div>
